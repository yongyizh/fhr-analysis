# FUNet v47 = funet-v42 with huber_delta 0.5 -- the mild end: measured at 0.97x of 0.5*MSE, so it should behave almost like v44.
#
# Only train.huber_delta differs from funet-v42. delta is a `train` field, so every
# arm in this sweep shares one architecture and one checkpoint contract.
#
# stereo_v7 is REBUILT from the raw recordings by lib/funet/generate_stereo_v7.sh, using the
# July clips spec v24 itself was generated from (training_clips_v7.yaml). Close to v24's data
# but not provably byte-identical: the generator has drifted since (it no longer reads
# ppg_col). funet-v43 is the mse control on this same rebuild, which is what makes the loss
# comparison airtight regardless of how faithful the rebuild is.
#
# Everything else is copied verbatim from models/funet-v24/fetal-config.yaml -- same
# architecture, same schedule, same augmentation, same stereo_v7 snippets -- so the val curve
# is a controlled read on the loss alone against v24's. The fields v24 predates (padding_mode,
# freq_crop_hz, interpolation, data.preprocess) are deliberately left out: their defaults are
# the v24 behaviour, and setting any of them would make this something other than a loss swap.
#
# The two runs are NOT comparable by loss value. torch's huber is the delta-scaled form, so for
# small residuals it equals 0.5 * the MSE; a huber run reads about half an mse run at the same
# fit quality. That is why train.measure_hr is on here and was not on v24: the HR-agreement
# curve is in bpm and *is* comparable across losses. It is diagnostic only -- the checkpoint is
# still selected by validation loss -- and costs roughly 17% wall clock.

model:
  # stereo_v7 is the 5-fiber set (1B, 2A, 2B, 2C, 2D), exactly as v24 ran it.
  # Must match the channel count of the {i}_mix.wav files in data.train_dir.
  channels: 5
  dilations: [1, 1, 1]
  bottleneck_dilation: 1
  bottleneck_convs: 2
  codec_convolutions: 3
  base_channels: 12
  dropout: 0.0
  n_fft: 1024
  hop_length: 256

train:
  optimizer: 'AdamW'
  learning_rate: 3.e-4
  weight_decay: 0.2
  batch_size: 8
  epochs: 80
  crop_len: 7
  loss: 'huber'   # <- the only change from v24, which ran 'mse'
  # Residual at which the loss turns from quadratic to linear, in fractions of a beat peak
  # (the target is rescaled to unit peak, exactly as under 'mse'). This is THE knob to sweep.
  # It must stay well under 1: the target's own peak is 1, so at torch's default delta of 1.0
  # every residual lands in the quadratic branch and huber degenerates into 0.5 * MSE. Too
  # small and it approaches L1, whose optimum on a mostly-zero target is a flat floor -- check
  # snippet_diagnostics.png for collapsed peaks if you go below ~0.05. Sweep 0.02 - 0.5.
  huber_delta: 0.5
  lr_schedule: 'cosine'
  min_lr: 1.e-5
  # Inert under 'huber' (corr_amp reads these); kept so the diff against v24 is one line.
  amp_weight: 0.1
  amp_beat_threshold: 0.1
  # On here, off in v24: the loss numbers are not comparable across the swap, this is.
  measure_hr: true
  augment: ['channel_dropout', 'gain', 'noise']
  freq_mask: 0
  time_mask: 0

data:
  train_dir: 'training/stereo_v7/fetal-train'
  val_dir: 'training/stereo_v7/fetal-test'   # held-out patient; selects model_best.pt
  num_workers: 8

model_dir: 'models/funet-v47/'
