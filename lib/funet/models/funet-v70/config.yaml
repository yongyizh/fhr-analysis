# FUNet v70 -- based on funet-v48. crop_len 16s (v48 itself is 7s).
# Data: 3 channels (1B/2A/2B), stereo_v7_3ch_len20. Huber at delta 0.02.
#
# One arm of a 2/4/7/16 s sample-length sweep. 16s at hop 256 = 251 spectrogram
# frames, floored to 248.
# Trained on stereo_v7_3ch_len20 (20s snippets): a 16s crop cannot run on the 10s
# build, where crop_time would silently zero-pad every sample.
#
# Archived by the training phase next to the checkpoints it produced. write_config
# round-trips the source YAML through yaml.safe_dump, which strips comments -- hence
# this header being added by hand.
model:
  channels: 3
  dilations:
  - 1
  - 1
  - 1
  bottleneck_dilation: 1
  bottleneck_convs: 2
  codec_convolutions: 3
  base_channels: 12
  dropout: 0.0
  n_fft: 1024
  hop_length: 256
train:
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.2
  batch_size: 8
  epochs: 80
  crop_len: 16
  loss: huber
  huber_delta: 0.02
  lr_schedule: cosine
  min_lr: 1.0e-05
  amp_weight: 0.1
  amp_beat_threshold: 0.1
  measure_hr: true
  augment:
  - channel_dropout
  - gain
  - noise
  freq_mask: 0
  time_mask: 0
data:
  train_dir: training/stereo_v7_3ch_len20/fetal-train
  val_dir: training/stereo_v7_3ch_len20/fetal-test
  num_workers: 8
model_dir: models/funet-v70/
