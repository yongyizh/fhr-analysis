model:
  channels: 3
  dilations:
  - 1
  - 1
  - 1
  bottleneck_dilation: 1
  bottleneck_convs: 2
  codec_convolutions: 3
  base_channels: 12
  dropout: 0.0
  n_fft: 1024
  hop_length: 256
train:
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.2
  batch_size: 8
  epochs: 80
  crop_len: 7
  loss: huber
  huber_delta: 0.1
  lr_schedule: cosine
  min_lr: 1.0e-05
  amp_weight: 0.1
  amp_beat_threshold: 0.1
  measure_hr: true
  augment:
  - channel_dropout
  - gain
  - noise
  freq_mask: 0
  time_mask: 0
data:
  train_dir: training/stereo_v7_3ch/fetal-train
  val_dir: training/stereo_v7_3ch/fetal-test
  num_workers: 8
model_dir: models/funet-v50/
