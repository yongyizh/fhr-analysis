# FUNet v72 = the mse counterpart of funet-v71: a SINGLE-CHANNEL FUNet on mse loss.
#
# It carries the funet-v29 recipe (v29 and v48 differ only in the loss -- their model
# sections are byte-identical), so v71 and v72 form a loss-only pair on mono data:
#   v72  mse     <- funet-v29's loss
#   v71  huber   <- funet-v48's loss, delta 0.02
# and each pairs with its own 3-channel ancestor, isolating the channel count.
#
# Where v29 stacks 3 fibers as input channels, this trains on mono_v7_len20: the same
# clips written one snippet per fiber, 5 fibers per window, all five sharing the window's
# hand-marked target. That is ~5x the training items from the same recordings.
#
# It is NOT 5x the information. The five fibers observe one heartbeat simultaneously from
# different positions, so they are strongly correlated; the honest independence ceiling is
# 3 patients either way. What this buys is more gradient steps, sensor-position diversity,
# and two things a multi-channel model cannot do: run on a single available fiber, and be
# ensembled across fibers at inference by averaging its per-fiber activity.
#
# The real risk is per-fiber SNR. In stereo the first conv can lean on whichever fibers
# carry signal; here a weak fiber is paired with a confident beat label, which trains the
# model to emit beats it cannot see. That is systematic label noise -- always the same
# weak fibers -- so watch snippet_diagnostics for activity on fibers that carry nothing.
#
# NOTE: 'channel_dropout' stays in train.augment but is INERT here -- common.augment's
# channel_dropout returns the mix unchanged when c <= 1. Effective augmentation is
# [gain, noise]. Left in the list so the diff against funet-v48 stays minimal.
#
# Validation also goes mono, so 227 windows become ~1135 correlated val items and the
# val loss is an average over 5 views of the same thing. It is NOT comparable to v48's.
# Compare on the HR metrics, and ideally on the fiber-ensembled model against v48.

model:
  # mono_v7_len20 writes ONE FIBER PER SNIPPET, so every mix is single-channel.
  channels: 1
  dilations: [1, 1, 1]
  bottleneck_dilation: 1
  bottleneck_convs: 2
  codec_convolutions: 3
  base_channels: 12
  dropout: 0.0
  n_fft: 1024
  hop_length: 256

train:
  optimizer: 'AdamW'
  learning_rate: 3.e-4
  weight_decay: 0.2
  batch_size: 8
  epochs: 80
  crop_len: 7
  loss: 'mse'   # funet-v29's loss; huber_delta below is inert under mse
  # Residual at which the loss turns from quadratic to linear, in fractions of a beat peak
  # (the target is rescaled to unit peak, exactly as under 'mse'). This is THE knob to sweep.
  # It must stay well under 1: the target's own peak is 1, so at torch's default delta of 1.0
  # every residual lands in the quadratic branch and huber degenerates into 0.5 * MSE. Too
  # small and it approaches L1, whose optimum on a mostly-zero target is a flat floor -- check
  # snippet_diagnostics.png for collapsed peaks if you go below ~0.05. Sweep 0.02 - 0.5.
  huber_delta: 0.02
  lr_schedule: 'cosine'
  min_lr: 1.e-5
  # Inert under 'huber' (corr_amp reads these); kept so the diff against v24 is one line.
  amp_weight: 0.1
  amp_beat_threshold: 0.1
  # On here, off in v24: the loss numbers are not comparable across the swap, this is.
  measure_hr: true
  augment: ['channel_dropout', 'gain', 'noise']
  freq_mask: 0
  time_mask: 0

data:
  train_dir: 'training/mono_v7_len20/fetal-train'
  val_dir: 'training/mono_v7_len20/fetal-test'   # held-out patient; selects model_best.pt
  num_workers: 8

model_dir: 'models/funet-v72/'
