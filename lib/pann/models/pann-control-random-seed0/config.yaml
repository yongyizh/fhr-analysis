model:
  channels: 3
  checkpoint: nicofarr/panns_Cnn14
  pretrained: false
  backbone_seed: 0
  hop_length: 320
  time_pool: 1
  head_hidden: 256
  head_layers: 2
  dropout: 0.0
train:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.1
  batch_size: 8
  epochs: 50
  crop_len: 7
  clip: 5.0
  loss: mse
  lr_schedule: cosine
  min_lr: 1.0e-05
  plateau_factor: 0.5
  plateau_patience: 3
  amp_weight: 0.1
  amp_beat_threshold: 0.1
  augment:
  - channel_dropout
  - gain
  - noise
data:
  train_dir: ../tslnet/training/stereo_v7_3chan/fetal-train
  val_dir: ../tslnet/training/stereo_v7_3chan/fetal-test
  num_workers: 8
  preprocess:
  - bandpass
  - normalize
model_dir: models/pann-control-random-seed0/
